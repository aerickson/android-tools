name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIPENV_PYTHON: '3.11'
  PIPENV_VENV_IN_PROJECT: '1'
  PIPENV_NOSPIN: '1'

jobs:
  test_worker_health:
    name: Worker health tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker_health
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: worker_health/Pipfile.lock
      - name: Install Pipenv
        run: python -m pip install pipenv
      - name: Install locked dependencies
        run: pipenv sync --dev
      - name: Run tests with coverage
        run: pipenv run pytest --cov=worker_health -vv tests/

  test_last_started:
    name: Last started dependency check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: devicepool_last_started_alert
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: devicepool_last_started_alert/Pipfile.lock
      - name: Install Pipenv
        run: python -m pip install pipenv
      - name: Install locked dependencies
        run: pipenv sync --dev
      - name: Check installed dependencies
        run: pipenv run python -m pip check
